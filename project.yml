# Xcode-Projekt für Signalwerk (iPhone und iPad). Erzeugen mit `xcodegen generate`
# (macht der Cloud-Build in .github/workflows/ios.yml). Team und Build-Nummer kommen beim
# Archivieren von außen (DEVELOPMENT_TEAM, CURRENT_PROJECT_VERSION).
name: Signalwerk
options:
  bundleIdPrefix: live.signalwerk
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SignalwerkKit:
    path: SignalwerkKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Signalwerk:
    type: application
    platform: iOS
    sources:
      - path: Signalwerk
    dependencies:
      - package: SignalwerkKit
        product: SignalwerkKit
    info:
      path: Signalwerk/Info.plist
      properties:
        CFBundleDisplayName: Signalwerk
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Für Live-Voice – deine Stimme geht live ins OBS-Widget.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.signalwerk.app
        PRODUCT_NAME: Signalwerk
        CODE_SIGN_ENTITLEMENTS: Signalwerk/Signalwerk.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES

  SignalwerkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SignalwerkUITests
    dependencies:
      - target: Signalwerk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.signalwerk.app.uitests
        TEST_TARGET_NAME: Signalwerk
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Signalwerk:
    build:
      targets:
        Signalwerk: all
        SignalwerkUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: SignalwerkUITests
    archive:
      config: Release
